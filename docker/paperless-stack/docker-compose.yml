services:
  ### ----------------------------------------------------------------------------
  ### 1. Valkey (Redis-Alternative): In-memory task queue broker for Celery
  ### ----------------------------------------------------------------------------
  redis:
    image: docker.io/valkey/valkey:8.0-alpine
    restart: unless-stopped
    volumes:
      - ${UNRAID_APPDATA:-/mnt/user/appdata}/paperless-redis:/data
    networks:
      - paperless-net

  ### ----------------------------------------------------------------------------
  ### 2. Gotenberg: Stateless engine converting Office docs/emails into PDF/A
  ### ----------------------------------------------------------------------------
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.7
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
      - "--api-timeout=60s" # Increased timeout for large office documents
    networks:
      - paperless-net

  ### ----------------------------------------------------------------------------
  ### 3. Apache Tika: Engine extracting text layers from complex file formats
  ### ----------------------------------------------------------------------------
  tika:
    image: docker.io/apache/tika:latest
    restart: unless-stopped
    networks:
      - paperless-net

  ### ----------------------------------------------------------------------------
  ### 4. Paperless-ngx: Core document management system
  ### ----------------------------------------------------------------------------
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - redis
      - gotenberg
      - tika
    ports:
      - "${PAPERLESS_PORT:-8777}:8000"
    volumes:
      - ${UNRAID_APPDATA:-/mnt/user/appdata}/paperless-ngx/data:/usr/src/paperless/data
      - ${UNRAID_MEDIA_MEDIA:-/mnt/user/paperless/media}:/usr/src/paperless/media
      - ${UNRAID_MEDIA_CONSUME:-/mnt/user/paperless-consume}:/usr/src/paperless/consume
      - ${UNRAID_MEDIA_EXPORT:-/mnt/user/paperless/export}:/usr/src/paperless/export
    environment:
      - PAPERLESS_TIME_ZONE=${PAPERLESS_TIME_ZONE:-Europe/Berlin}
      - PAPERLESS_OCR_LANGUAGE=${PAPERLESS_OCR_LANGUAGE:-deu+eng} # Configures primary languages
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      
      # Unraid Host permission mapping (nobody:users)
      - USERMAP_UID=${USERMAP_UID:-99}
      - USERMAP_GID=${USERMAP_GID:-100}
      
      # Internal Redis connection url
      - PAPERLESS_REDIS=redis://redis:6379
      
      # External database connection (mapping to your existing postgresql17 container)
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=${PAPERLESS_DBHOST:-postgresql17} # Resolved internally via "paperless-net" DNS
      - PAPERLESS_DBPORT=${PAPERLESS_DBPORT:-5432}
      - PAPERLESS_DBNAME=${PAPERLESS_DBNAME:-paperless}
      - PAPERLESS_DBUSER=${PAPERLESS_DBUSER:-paperless}
      - PAPERLESS_DBPASS=${PAPERLESS_DBPASS}
      
      # Document Parsing Extensions
      - PAPERLESS_TIKA_ENABLED=true
      - PAPERLESS_TIKA_ENDPOINT=http://tika:9998
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://gotenberg:3000
      
      # Native AI Features: Interactive RAG Chat & UI Suggestions
      - PAPERLESS_AI_ENABLED=true
      - PAPERLESS_AI_LLM_BACKEND=openai-like
      - PAPERLESS_AI_LLM_MODEL=${PAPERLESS_AI_MODEL}
      - PAPERLESS_AI_LLM_ENDPOINT=${PAPERLESS_AI_ENDPOINT}
      - PAPERLESS_AI_LLM_API_KEY=${PAPERLESS_AI_API_KEY}
      - PAPERLESS_AI_LLM_EMBBEDDING_BACKEND=huggingface
      
      # Directory Routing for OCR
      - PAPERLESS_CONSUMER_RECURSIVE=true
      - PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS=true
    networks:
      - paperless-net

  ### ----------------------------------------------------------------------------
  ### 5. Paperless-GPT: Offline AI-agent workflow for tagging and classification
  ### ----------------------------------------------------------------------------
  paperless-gpt:
    image: icereed/paperless-gpt:latest
    container_name: paperless-gpt
    restart: unless-stopped
    depends_on:
      - webserver
    ports:
      - "${GPT_PORT:-3002}:8080"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${USERMAP_UID:-99} # Unraid UID
      - PGID=${USERMAP_GID:-100} # Unraid GID
      - PAPERLESS_BASE_URL=http://webserver:8000 # Direct internal communication
      - PAPERLESS_API_TOKEN=${PAPERLESS_API_TOKEN}
      - PDF_SKIP_EXISTING_OCR=true
      
      # Dynamic LLM Provider Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-qwen3:8b}
      
      # Local Ollama Backend Settings
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-4096}
      - TOKEN_LIMIT=${TOKEN_LIMIT:-2000}
      - OLLAMA_THINK=${OLLAMA_THINK:-false} # Disabled reasoning for structured tasks
      
      # Cloud/Commercial LLM Backend Settings (Requesty, OpenAI, Gemini)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - GOOGLEAI_API_KEY=${GOOGLEAI_API_KEY:-}
      
      # Vision / iGPU OCR settings
      - OCR_PROVIDER=${OCR_PROVIDER:-llm}
      - VISION_LLM_PROVIDER=${VISION_LLM_PROVIDER:-ollama}
      - VISION_LLM_MODEL=${VISION_LLM_MODEL:-minicpm-v}
      - AUTO_OCR_TAG=${AUTO_OCR_TAG:-paperless-gpt-ocr-auto}
      - PDF_OCR_TAGGING=${PDF_OCR_TAGGING:-true}
      - PDF_UPLOAD=${PDF_UPLOAD:-false}
      - PDF_OCR_COMPLETE_TAG=${PDF_OCR_COMPLETE_TAG:-paperless-gpt-ocr-complete}
      
      # Automation pipelines enabled
      - AUTO_GENERATE_TITLE=${AUTO_GENERATE_TITLE:-true}
      - AUTO_GENERATE_CORRESPONDENTS=${AUTO_GENERATE_CORRESPONDENTS:-true}
      - AUTO_GENERATE_DOCUMENT_TYPE=${AUTO_GENERATE_DOCUMENT_TYPE:-true}
      - AUTO_GENERATE_TAGS=${AUTO_GENERATE_TAGS:-true}
      - CREATE_NEW_TAGS=${CREATE_NEW_TAGS:-false}
      - AUTO_TAG=${AUTO_TAG:-paperless-gpt-auto}
      
      # iGPU-Optimization: reduce file size
      - IMAGE_MAX_RENDER_DPI=${IMAGE_MAX_RENDER_DPI:-150} # Standard: 600
      - IMAGE_MAX_PIXEL_DIMENSION=${IMAGE_MAX_PIXEL_DIMENSION:-2000} # Standard: 10000
      - IMAGE_MAX_TOTAL_PIXELS=${IMAGE_MAX_TOTAL_PIXELS:-4000000}
    volumes:
      - ${UNRAID_APPDATA:-/mnt/user/appdata}/paperless-gpt/config:/app/config
      - ./prompts:/app/prompts:rw
    networks:
      - paperless-net

networks:
  paperless-net:
    name: paperless-net
